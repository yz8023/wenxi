name: Set up AsterLink toolchains
description: Install the versions used to build and test the public source.
inputs:
  android:
    description: Install Java for Android builds.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.24.7'
        cache: false
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      if: inputs.android == 'true'
      with:
        distribution: temurin
        java-version: '21'
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: '3.41.4'
        cache: false
