import java.io.File
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their MD5 checksums.
        def filesToDownload = [
            ["url": "https://gh-proxy.com/https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-arm64-v8a.jar", "md5": "83df25b61193af8fa815e373143ac9af", "destination": file("$buildDir/v1.1.7/default-arm64-v8a.jar")],
            ["url": "https://gh-proxy.com/https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-armeabi-v7a.jar", "md5": "22e21526fefc0a2b8f17adbec9f57590", "destination": file("$buildDir/v1.1.7/default-armeabi-v7a.jar")],
            ["url": "https://gh-proxy.com/https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-x86_64.jar", "md5": "6fa26bf0459b11f1c0b0dbc29e5b940d", "destination": file("$buildDir/v1.1.7/default-x86_64.jar")],
            ["url": "https://gh-proxy.com/https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-x86.jar", "md5": "0d742b756dc9d1fcd84ea271d8b68f32", "destination": file("$buildDir/v1.1.7/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != fileInfo.md5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                def partialFile = new File(destFile.parentFile, destFile.name + '.download')
                def sources = [fileInfo.url.replace('https://gh-proxy.com/', ''), fileInfo.url]
                def lastFailure = null
                for (def source : sources) {
                    def connection = null
                    try {
                        println "Downloading file from: ${source}"
                        connection = new URL(source).openConnection()
                        connection.setConnectTimeout(15000)
                        connection.setReadTimeout(30000)
                        connection.getInputStream().withCloseable { input ->
                            partialFile.withOutputStream { output -> output << input }
                        }
                        def actual = MessageDigest.getInstance('MD5').digest(Files.readAllBytes(partialFile.toPath())).encodeHex().toString()
                        if (actual != fileInfo.md5) {
                            throw new GradleException("MD5 verification failed for ${destFile.name}")
                        }
                        Files.move(partialFile.toPath(), destFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
                        lastFailure = null
                        break
                    } catch (Exception failure) {
                        lastFailure = failure
                        println "Download failed for ${destFile.name}: ${failure.class.simpleName}"
                    } finally {
                        partialFile.delete()
                        if (connection instanceof HttpURLConnection) connection.disconnect()
                    }
                }
                if (lastFailure != null) {
                    throw new GradleException("Unable to download ${destFile.name} from GitHub or the mirror", lastFailure)
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
