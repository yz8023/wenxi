name: asterlink
description: 文析助手，支持网盘解析、下载和 BT 在线播放。
publish_to: none
version: 1.0.7+107

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_svg: 2.3.0
  dio: 5.11.1
  html: 0.15.7
  crypto: 3.0.7
  archive: 4.2.0
  pointycastle: 4.0.0
  path: 1.9.1
  path_provider: 2.1.6
  flutter_inappwebview: 6.1.5
  flutter_secure_storage: 11.1.1
  file_selector: 1.1.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  open_filex: 4.7.0
  url_launcher: 6.3.2
  share_plus: 13.3.0
  window_manager: 0.5.2
  tray_manager: 0.5.3

dev_dependencies:
  file_selector_android: ^0.5.2+6
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/navigation/
    - assets/licenses/
    - assets/support/appreciation-code.png
dependency_overrides:
  file_selector_android:
    path: vendor_plugins/file_selector_android
  media_kit:
    path: vendor_plugins/media_kit
  media_kit_libs_android_video:
    path: vendor_plugins/media_kit_libs_android_video
  media_kit_libs_windows_video:
    path: vendor_plugins/media_kit_libs_windows_video
  flutter_inappwebview_windows:
    path: vendor_plugins/flutter_inappwebview_windows
